[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subsea-cable-disturbance"
version = "0.1.0"
description = "Reproducible uncertainty-aware multimodal evidence fusion research prototype"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pydantic>=1.10",
  "pyyaml>=6.0",
  "scipy>=1.11",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
ui = ["streamlit>=1.30", "plotly>=5.18"]
test = ["pytest>=8.0"]
ml = ["scikit-learn>=1.4", "xgboost>=2.0"]
realdata = ["h5py>=3.10"]

[project.scripts]
subsea-simulate = "subsea.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
